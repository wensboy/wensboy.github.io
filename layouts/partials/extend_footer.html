{{- /* Extension: copy button of the code containers (.code-card / .codeblock).
       Markup: layouts/partials/code_copy_button.html */ -}}
<script>
    (() => {
        const writeClipboard = (text) => {
            if (navigator.clipboard && window.isSecureContext) {
                return navigator.clipboard.writeText(text);
            }

            return new Promise((resolve, reject) => {
                const area = document.createElement("textarea");
                area.value = text;
                area.setAttribute("readonly", "");
                area.style.position = "fixed";
                area.style.top = "-1000px";
                area.style.opacity = "0";
                document.body.appendChild(area);
                area.select();
                try {
                    document.execCommand("copy") ? resolve() : reject(new Error("copy failed"));
                } catch (err) {
                    reject(err);
                } finally {
                    document.body.removeChild(area);
                }
            });
        };

        // .code-card holds a single code block, while the codeblock shortcode keeps one copy
        // button per tab bar: always copy the code of the currently visible pane.
        const resolveCode = (container) => {
            const panes = container.querySelectorAll("[data-codeblock-pane]");
            const pane = panes.length
                ? [...panes].find((item) => !item.hidden) || panes[0]
                : container;
            return pane.querySelector("pre code");
        };

        const initCodeCopy = () => {
            document.querySelectorAll("[data-code-copy]").forEach((button) => {
                if (button.dataset.ready) return;
                const container = button.closest("[data-code-card], [data-codeblock]");
                if (!container) return;
                button.dataset.ready = "true";

                const idleLabel = button.getAttribute("aria-label") || "Copy code";
                const doneLabel = button.dataset.labelCopied || "Copied";
                let timer;

                button.addEventListener("click", () => {
                    const code = resolveCode(container);
                    if (!code) return;

                    writeClipboard(code.textContent).then(() => {
                        button.classList.add("is-copied");
                        button.setAttribute("aria-label", doneLabel);
                        button.setAttribute("title", doneLabel);
                        clearTimeout(timer);
                        timer = setTimeout(() => {
                            button.classList.remove("is-copied");
                            button.setAttribute("aria-label", idleLabel);
                            button.setAttribute("title", idleLabel);
                        }, 2000);
                    }).catch(() => { });
                });
            });
        };

        if (document.readyState === "loading") {
            document.addEventListener("DOMContentLoaded", initCodeCopy, { once: true });
        } else {
            initCodeCopy();
        }
    })();
</script>
